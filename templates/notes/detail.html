{% extends "base.html" %}
{% block title %}{{ note.title }} — Quaterdeck{% endblock %}
{% block nav_notes %}active{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start">
  <div>
    <h1 class="h3 mb-2">{{ note.title }}</h1>
    <small class="text-muted">Last updated {{ note.updated_at|date:"d M Y H:i" }}</small>
  </div>
  <div class="text-nowrap">
    <a href="{% url 'notes:note_edit' note.pk %}" class="btn btn-outline-secondary btn-sm">Edit</a>
    <a href="{% url 'notes:note_delete' note.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
  </div>
</div>
<hr>
<div class="mt-3">{{ note.body|linebreaks }}</div>

<hr>
<form hx-post="{% url 'notes:note_enrich' note.pk %}" hx-target="#suggestions" hx-swap="innerHTML">
  {% csrf_token %}
  <button type="submit" class="btn btn-outline-primary btn-sm">Enrich ▸</button>
</form>
<div id="suggestions" class="mt-3"></div>
{% endblock %}
