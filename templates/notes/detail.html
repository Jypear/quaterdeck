{% extends "base.html" %}
{% block title %}{{ note.title }} — Quaterdeck{% endblock %}
{% block nav_notes %}active{% endblock %}
{% block content %}
<h1 class="h3 mb-2">{{ note.title }}</h1>
<small class="text-muted">Last updated {{ note.updated_at|date:"d M Y H:i" }}</small>
<hr>
<div class="mt-3">{{ note.body|linebreaks }}</div>
{% endblock %}
