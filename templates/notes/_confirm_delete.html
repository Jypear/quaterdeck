{% extends "base.html" %}
{% block title %}Delete {{ object }} — Quaterdeck{% endblock %}
{% block nav_notes %}active{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Delete "{{ object }}"?</h1>
<p class="text-muted">This cannot be undone.</p>
<form method="post" class="col-12 col-md-6">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">{% include "_icon.html" with name="trash3" class="me-1" %}Delete</button>
  <a href="{{ cancel_url }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
