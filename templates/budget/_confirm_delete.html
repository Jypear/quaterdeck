{% extends "base.html" %}
{% block title %}Delete {{ object }} — Quaterdeck{% endblock %}
{% block nav_budget %}active{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Delete "{{ object }}"?</h1>
<p class="text-muted">This cannot be undone.</p>
<form method="post" class="col-12 col-md-6">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Delete</button>
  <a href="{% url 'budget:accounts' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
