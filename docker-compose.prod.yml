services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-quaterdeck}
      POSTGRES_USER: ${DB_USER:-quaterdeck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quaterdeck}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-quaterdeck}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/jypear/quaterdeck:latest
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
